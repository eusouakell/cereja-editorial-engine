name: Editorial Engine Checks

on:
  pull_request:
  push:
    branches:
      - agentic-factory-v1
      - main

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run deterministic checks
        run: python -m unittest discover -s tests -v
