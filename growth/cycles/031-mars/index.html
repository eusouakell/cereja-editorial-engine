<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cereja Flamejante · Marte e batatas</title><link rel="stylesheet" href="style.css"><main class="preview"><h1>Água em Marte! E as batatas?</h1><p>Experimento #031 · seis páginas em 1080 × 1350 · aguardando revisão de Kell.</p><p><a href="packet.md">Briefing, legenda, fontes e revisão</a> · <a href="alt-text.json">Textos alternativos</a></p><div class="grid"><a href="slide-01.png"><img src="slide-01.png" alt="Colagem em papel creme: uma batata brotando diante de Marte, com linha vermelha e recortes verdes. Texto: Água em Marte! E as batatas?"></a><a href="slide-02.png"><img src="slide-02.png" alt="A pista estava na rocha. O Perseverance encontrou em Jezero rochas formadas de magma com marcas de contato com água. Diagrama conceitual mostra o laser do SuperCam atingindo uma rocha. Mais de 185 pontos foram analisados."></a><a href="slide-03.png"><img src="slide-03.png" alt="A água passou por ali pelo menos três vezes: água subterrânea rica em CO2 deixou carbonatos; outro contato pode estar ligado ao antigo lago; veios minerais indicam água quente posterior. A ordem foi reconstruída, mas as datas faltam. Não é uma descoberta de água pronta para beber."></a><a href="slide-04.png"><img src="slide-04.png" alt="E a horta de Perdido em Marte? Plantar batatas exige água adequada, luz, nutrientes e ambiente protegido e pressurizado. O material da superfície de Marte tem poucos nutrientes e contém percloratos. A batata não vem com kit de sobrevivência."></a><a href="slide-05.png"><img src="slide-05.png" alt="As batatas já passaram pela NASA. Nos anos 1990, houve testes de hidroponia em ambiente controlado na Terra, usando bandejas com uma fina camada de água e nutrientes. Esquema mostra batatas e solução nutritiva circulando. O trabalho despertou interesse da Frito-Lay. Fonte histórica NASA, 2016."></a><a href="slide-06.png"><img src="slide-06.png" alt="Uma notícia. Um filme. Uma batata. Na edição 31 da Cereja Flamejante, essa curiosidade divide espaço com Carrie, Junji Ito e outras coisas estranhas que me fizeram abrir mais uma aba. Assinar Newsletter, link na bio."></a></div></main></html>
